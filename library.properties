sentence=Declarative desktop-style C++ GUI framework. Supports SSD1306, SH1106, KS0108, PCD8544, and HD44780 (LCD I2C) controllers.
paragraph=A lightweight, high-ergonomics C++ UI library designed for resource-constrained displays driven by physical keypads. EVA Boxy delivers modern declarative code comfort using compile-time template composition. It also provides a robust, state-safe imperative API for direct screen control and is optimized for low-resolution text, symbols, and Remixicon vector graphics. 
