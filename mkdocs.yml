site_name: EVA Boxy
site_description: EVA Boxy
repo_url: https://github.com/agusevtec/eva-boxy
theme: 
   name: material
   font:
       code: Consolas
docs_dir: 'docs-md'
site_dir: 'docs'
nav:
  - What is it?: index.md
  - Tutorial:
      - Imperative Style:
           - Display Initialization: imperative-style/display-drivers.md
           - Imperative Drawing: imperative-style/imperative-drawing.md
           - Visual Modifiers: imperative-style/visual-modifiers.md
           - Boxy-Rest: imperative-style/boxyrest.md
      - Declaration Style:
           - Core Concepts: declaration-style/core-concepts.md
           - Behavioral Modifiers: declaration-style/behavioral-modifiers.md
           - Layout and Focus: declaration-style/layout-and-focus.md
           - Listboxes: declaration-style/listboxes.md
      - Intermediate Style:
           - Custom User Controls: intermediate-style/custom-user-controls.md
           - Composite-base: intermediate-style/composite-base.md
           - Progressive Optimization: intermediate-style/progressive_optimization.md
      - Other:
           - Fonts and pictograms: other/fonts-and-pictograms.md

  - API Reference:
      - Classes: eva-boxy/annotated.md
      - Hierarchy: eva-boxy/hierarchy.md
      - Files: eva-boxy/files.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true

plugins:
  - search
  - mkdoxy:
      projects:
        eva-boxy:
          src-dirs: ./src
          full-doc: True
          doxy-cfg:
            FILE_PATTERNS: "*.h"
            RECURSIVE: True
            EXTRACT_ALL: NO 
            EXTRACT_STRUCT: NO
            EXTRACT_PRIVATE: NO
            EXTRACT_STATIC: YES

